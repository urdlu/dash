name: IBKR Flex (read-only)

on:
  schedule:
    # IBKR builds "Last Business Day" activity statements overnight. 10:30 UTC
    # = 3:30am PDT / 2:30am PST, so the data is in before 6am PT; 13:00 UTC is
    # a backup in case GitHub fires the first one late or IBKR isn't ready.
    - cron: "30 10 * * 2-6"
    - cron: "0 13 * * 2-6"
    # After the close: picks up today's trade confirmations.
    - cron: "45 21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  issues: write  # token-expiry reminder

concurrency:
  group: ibkr
  cancel-in-progress: false

jobs:
  flex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Pull Flex statements and update the sheet
        id: flex
        env:
          IBKR_FLEX_TOKEN: ${{ secrets.IBKR_FLEX_TOKEN }}
          IBKR_FLEX_ACTIVITY_ID: ${{ secrets.IBKR_FLEX_ACTIVITY_ID }}
          IBKR_FLEX_TRADES_ID: ${{ secrets.IBKR_FLEX_TRADES_ID }}
          IBKR_TOKEN_EXPIRES: ${{ vars.IBKR_TOKEN_EXPIRES || secrets.IBKR_TOKEN_EXPIRES }}
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
        run: python scripts/ibkr_flex.py

      - name: Token-expiry reminder (opens one GitHub issue, which emails Tim)
        if: steps.flex.outputs.expiry_warning != ''
        env:
          GH_TOKEN: ${{ github.token }}
          MSG: ${{ steps.flex.outputs.expiry_warning }}
        run: |
          title="Renew the IBKR Flex token"
          if [ -z "$(gh issue list --state open --search "$title in:title" --json number -q '.[].number')" ]; then
            gh issue create --title "$title" --body "$MSG"
          fi
