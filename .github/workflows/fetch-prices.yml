name: Fetch prices

on:
  schedule:
    # Full refresh after the US/TSX close. 21:15 UTC is after 4pm ET in both
    # EDT (close = 20:00 UTC) and EST (close = 21:00 UTC), so no DST edits.
    - cron: "15 21 * * 1-5"
    # Overnight full refreshes so data is in place before 6am PT even when
    # GitHub fires schedules hours late (observed: 1-6 h). 03:00 and 08:00 UTC
    # are after the prior close and before 6am PT in both PDT and PST.
    - cron: "0 3,8 * * 2-6"
    # No intraday schedule (Tim: daily is enough). Full runs still write the
    # last session's 5-min bars to the Intraday tab, so the 1D button works.
  workflow_dispatch:
    inputs:
      mode:
        description: "full or intraday"
        default: full

permissions:
  contents: write  # the data-commit step pushes data/

concurrency:
  group: prices      # never two runs writing the sheet at once
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch prices and update the sheet
        id: fetch
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          CRON_SCHEDULE: ${{ github.event.schedule }}
        run: python scripts/fetch_prices.py ${{ github.event.inputs.mode && format('--mode {0}', github.event.inputs.mode) || '' }}

      - name: Update options P&L (WS trades, Yahoo option marks)
        if: steps.fetch.outputs.mode == 'full'
        continue-on-error: true
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
        run: python scripts/options_pnl.py

      - name: Commit updated data files
        if: steps.fetch.outputs.mode == 'full'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data/
          git diff --cached --quiet || git commit -m "Update price data [skip ci]"
          git pull --rebase -q && git push
