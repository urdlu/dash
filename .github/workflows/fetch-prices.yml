name: Fetch prices

on:
  schedule:
    # 13:50 and 20:50 UTC = 6:50am / 1:50pm PT during PDT (UTC-7).
    # During PST (UTC-8, roughly Nov-Mar) this runs an hour later local time;
    # bump both hours by 1 (12,19) if you want it pinned to clock time.
    - cron: "50 13,20 * * *"
  workflow_dispatch: {}  # allows manual "Run workflow" from the Actions tab

permissions:
  contents: write  # the "Commit updated data files" step needs to push

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Fetch prices and update the sheet
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
        run: python scripts/fetch_prices.py

      - name: Commit updated data files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Update price data [skip ci]"
          git push
